return `<div class="hero"><div><div style="opacity:.85;font-size:14px">${g?(T>g?'Te pasaste del presupuesto':'Disponible'):'Total del periodo'}</div><div class="big">${money(g?Math.abs(g-T):T)}</div><div style="font-size:13px;opacity:.9">${g?'Gastado '+money(T)+' de '+money(g):L.length+' gasto(s)'}</div><div style="font-size:13px;opacity:.9;margin-top:4px">${cmp}</div></div>${g?`<div class="ring" style="--p:${Math.min(100,T/g*100)}"><b>${Math.round(T/g*100)}%</b></div>`:''}</div>${mode!='rng'?`<button class="b g" onclick="gb()">${g?'✎ Cambiar presupuesto '+MN[mode]:'＋ Definir presupuesto '+MN[mode]}</button>`:''}`}
function donut(bc,T){const k=Object.entries(bc).sort((x,y)=>y[1]-x[1]);if(!k.length||!T)return'';let a=0;const seg=k.map(([c,v])=>{const s=a;a+=v/T*100;return`${col(c)} ${s}% ${a}%`}).join(',');
return `<div class="card"><div class="row" style="gap:14px"><div class="dn" style="background:conic-gradient(${seg})"><i></i></div><div class="lgd">${k.map(([c,v])=>{const g=mode=='mes'&&D.bud&&D.bud[c];return `<div class="row" style="padding:3px 0;gap:6px"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span class="dot" style="background:${col(c)}"></span>${esc(c)}</span><b style="font-size:14px;white-space:nowrap">${money(v)}${g?` <span class="mu s">/ ${money(g)}</span>`:''}${g&&v>g?' ⚠️':''}</b></div>`}).join('')}</div></div></div>`}
function mod(e,f,c){const x=e||{f:f||iso(new Date()),n:'',c:c||D.cats[0],m:'',t:''};mc=x.c;
$('#modal').innerHTML=`<div class="ov"><div class="sh"><div class="row"><h2>${e?'Editar gasto':'Nuevo gasto'}</h2><button class="ic" onclick="cl()">✕</button></div>
<input id="mm" class="amt" type="number" inputmode="decimal" step="0.01" placeholder="${th.c}0.00" value="${x.m}">
<label>Categoría</label><div class="cc" id="cc">${D.cats.map((k,i)=>`<button class="${k==mc?'sel':''}" onclick="pc(${i})">${ico(k)} ${esc(k)}</button>`).join('')}<button onclick="pc(-1)">＋ Nueva</button></div><input id="nc" style="display:none" placeholder="Nombre de la categoría">
<label>Concepto</label><input id="mn" list="dl" value="${esc(x.n)}" placeholder="Ej. Almuerzo"><datalist id="dl">${[...new Set(D.exp.map(z=>z.n))].slice(0,60).map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
<label>Fecha</label><input id="mf" type="date" value="${x.f}">
<label>Nota (opcional)</label><input id="mt" value="${esc(x.t)}">
<div class="bt"><button class="b" onclick="sv('${e?e.id:''}')">Guardar</button>${e?`<button class="b d" onclick="dl('${e.id}')">Eliminar</button>`:`<button class="b g" onclick="sv('',1)">Guardar y otro</button>`}</div></div></div>`;setTimeout(()=>{if(!e)$('#mm').focus()},60)}
function pc(i){mc=i<0?'__n':D.cats[i];$('#nc').style.display=i<0?'block':'none';if(i<0)$('#nc').focus();[...$('#cc').children].forEach((b,j)=>b.classList.toggle('sel',i<0?j==D.cats.length:j==i))}
ap();fit();addEventListener('resize',fit);
const MN={dia:'diario',sem:'semanal',qui:'quincenal',mes:'mensual'};
function bcard(T){if(mode=='rng')return'';const g=D.gb&&D.gb[mode];
if(!g)return `<button class="b g" onclick="gb()">＋ Definir presupuesto ${MN[mode]}</button>`;
const r=g-T,p=Math.min(100,T/g*100);
return `<div class="card"><div class="row"><b>Presupuesto ${MN[mode]}</b><span><b>${money(g)}</b><button class="ic" onclick="gb()">✎</button></span></div><div class="pb"><i style="width:${p}%;${r<0?'background:var(--rd)':''}"></i></div><div class="row"><span class="mu">Gastado ${money(T)}</span><b style="color:${r<0?'var(--rd)':'#19c08c'}">${r<0?'Excedido '+money(-r):'Disponible '+money(r)}</b></div></div>`}
function gb(){ask('Presupuesto '+MN[mode]+' (solo número; 0 para quitarlo)',v=>{const n=parseFloat(v);if(isNaN(n)||n<0)return er('Monto inválido');D.gb=D.gb||{};if(n)D.gb[mode]=n;else delete D.gb[mode];save();R()},D.gb&&D.gb[mode]||'')}
function chart(a,nd,L){const v=[];for(let i=0;i<nd;i++){const f=iso(new Date(a.getFullYear(),a.getMonth(),a.getDate()+i));v.push([f,sum(L.filter(e=>e.f==f))])}const mx=Math.max(1,...v.map(x=>x[1]));
return `<div class="card"><div class="mu s">Gasto por día (toca una barra para ver ese día)</div><div class="ch">${v.map(([f,t])=>`<div onclick="anc=pd('${f}');mode='dia';R()"><i style="height:${t/mx*100}%"></i></div>`).join('')}</div><div class="row mu s"><span>${pd(v[0][0]).getDate()}</span><span>máx. ${money(mx)}</span><span>${pd(v[nd-1][0]).getDate()}</span></div></div>`}
function vTabla(){const[a,b]=rg(),A=iso(a),B=iso(b),cs=D.cats,L=D.exp.filter(e=>e.f>=A&&e.f<=B),rows=[];
for(let d=new Date(a),n=0;d<=b&&n<400;d.setDate(d.getDate()+1),n++){const f=iso(d),q=L.filter(e=>e.f==f);rows.push([f,cs.map(c=>sum(q.filter(e=>e.c==c))),sum(q)])}
const ct=cs.map(c=>sum(L.filter(e=>e.c==c))),cell=(v,f,i)=>`<td onclick="nw('${f}',${i})">${v?money(v):'<span class="mu">·</span>'}</td>`;
return `<h2>Tabla</h2>${chips()}${navp()}<p class="mu s">Filas = días, columnas = categorías. Toca una celda para agregar un gasto ahí.</p><div class="tw"><table><thead><tr><th>Día</th>${cs.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Total</th></tr></thead><tbody>${rows.map(([f,v,t])=>`<tr><td onclick="nw('${f}')">${pd(f).toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'})}</td>${v.map((x,i)=>cell(x,f,i)).join('')}<td><b>${t?money(t):'·'}</b></td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td>${ct.map(x=>`<td>${money(x)}</td>`).join('')}<td>${money(sum(L))}</td></tr></tfoot></table></div>`}
function vLic(bl){return `<div class="${bl?'box':''}"><h2>🔑 Activación</h2>${LIC?'<p>Licencia activa ✓</p><div class="code">'+dev+'</div>':`<p class="mu">${bl?'Tu prueba terminó. ':'Prueba: '+trial()+' día(s) restantes. '}Envía este código de dispositivo a quien te vendió la app:</p><div class="code">${dev}</div><p class="mu s">Te dará un código de activación. Pégalo aquí:</p><textarea id="lc" rows="3" placeholder="Código de activación"></textarea><button class="b" onclick="act()">Activar</button>`}</div>`}
async function act(){const c=$('#lc').value.trim();if(await lic(c)){LIC=true;LS.set('cg_lic',c);er('¡Activada!');R()}else er('Código inválido para este dispositivo')}
function vLogin(){const f=!db.users.length;return `<div class="box">${logo(130)}<div class="brand" style="font-size:26px;margin-top:8px">MC SYSTEM</div><p class="mu c" style="padding:4px 0 10px;letter-spacing:2px">CONTROL DE GASTOS</p><p class="mu">${f?'Crea tu cuenta de administrador':'Inicia sesión'}</p><input id="lu" placeholder="Usuario" autocapitalize="none"><input id="lp" type="password" placeholder="Contraseña"><button class="b" onclick="${f?'reg()':'login()'}">${f?'Crear cuenta':'Entrar'}</button></div><div class="card" style="max-width:420px;margin:14px auto 0">${vLic(false)}</div><div class="card" style="max-width:420px;margin:14px auto 0">${vInst()}</div>`}
function vSet(){const adm=db.users[0].u==U;return `<h2>Ajustes</h2>
<div class="card"><h3>🎨 Apariencia</h3><div class="chips">${[['auto','Auto'],['dark','Oscuro'],['light','Claro']].map(([k,n])=>`<button class="${th.m==k?'on':''}" onclick="st('m','${k}')">${n}</button>`).join('')}</div><div class="row" style="justify-content:flex-start;gap:10px;margin:10px 0">${Object.entries(PAL).map(([k,p])=>`<button class="sw ${th.a==k?'on2':''}" style="background:linear-gradient(135deg,${p[0]},${p[1]})" onclick="st('a','${k}')"></button>`).join('')}</div><label>Moneda</label><select onchange="st('c',this.value)">${['$','S/','€','Q','L','Bs','₡','RD$','US$'].map(c=>`<option ${th.c==c?'selected':''}>${c}</option>`).join('')}</select></div>
<div class="card"><h3>Categorías (columnas)</h3>${D.cats.map((c,i)=>`<div class="row"><span>${esc(c)}${D.bud&&D.bud[c]?` <span class="mu s">· presup. ${money(D.bud[c])}</span>`:''}</span><span><button class="ic" onclick="bd(${i})">💲</button><button class="ic" onclick="rn(${i})">✎</button><button class="ic" onclick="dc(${i})">🗑</button></span></div>`).join('')}<div class="row"><input id="ac" placeholder="Nueva categoría"><button class="b sm" onclick="addc()">Agregar</button></div></div>
<div class="card"><h3>Mi contraseña</h3><input id="np" type="password" placeholder="Nueva contraseña"><button class="b sm" onclick="cp()">Cambiar</button></div>
${adm?`<div class="card"><h3>Usuarios</h3>${db.users.map((x,i)=>`<div class="row"><span>${esc(x.u)}${i?'':' (admin)'}</span>${i?`<button class="ic" onclick="du(${i})">🗑</button>`:''}</div>`).join('')}<input id="nu" placeholder="Usuario nuevo" autocapitalize="none"><input id="np2" type="password" placeholder="Contraseña"><button class="b sm" onclick="au()">Crear usuario</button></div>`:''}
<div class="card"><h3>Respaldo</h3><textarea id="bk" rows="4" placeholder="Aquí aparece el respaldo (cópialo). Para restaurar, pégalo aquí."></textarea><div class="bt"><button class="b sm" onclick="$('#bk').value=JSON.stringify(D)">Respaldo</button><button class="b sm g" onclick="bkc()">CSV</button><button class="b sm g" onclick="rst()">Restaurar</button></div></div>
<div class="card">${vLic(false)}</div><div class="card">${vInst()}</div><button class="b d" onclick="out()">Cerrar sesión</button>`}
function R(){const blk=!LIC&&trial()<=0;let h,nv=true;
if(blk){h=vLic(true);nv=false}else if(!U||!D){h=vLogin();nv=false}else h=({inicio:vHome,tabla:vTabla,ajustes:vSet})[tab]();
$('#app').innerHTML=h;
$('#nav').innerHTML=nv?`<button class="${tab=='inicio'?'a':''}" onclick="tab='inicio';R()">🏠<span>Inicio</span></button><button class="${tab=='tabla'?'a':''}" onclick="tab='tabla';R()">▦<span>Tabla</span></button><button class="fab" onclick="mod()">＋</button><button class="${tab=='ajustes'?'a':''}" onclick="tab='ajustes';R()">⚙️<span>Ajustes</span></button>`:''}
/* ---- usuarios ---- */
async function mk(u,p){const s=gen();db.users.push({u,s,h:await hp(p,s)});db.data[u]={cats:['Comida','Transporte','Servicios','Otros'],exp:[]};save()}
function ses(u){U=u;LS.set('cg_ses',u);D=db.data[u];tab='inicio';R()}
async function reg(){const u=$('#lu').value.trim(),p=$('#lp').value;if(u.length<3||p.length<4)return er('Usuario mín. 3 y contraseña mín. 4 caracteres');await mk(u,p);ses(u)}
async function login(){const u=$('#lu').value.trim().toLowerCase(),x=db.users.find(z=>z.u.toLowerCase()==u);if(!x||await hp($('#lp').value,x.s)!=x.h)return er('Usuario o contraseña incorrectos');ses(x.u)}
function out(){U=null;D=null;LS.set('cg_ses',null);R()}
async function au(){const u=$('#nu').value.trim(),p=$('#np2').value;if(u.length<3||p.length<4)return er('Usuario mín. 3 y contraseña mín. 4');if(db.users.some(z=>z.u.toLowerCase()==u.toLowerCase()))return er('Ese usuario ya existe');await mk(u,p);er('Usuario creado');R()}
function du(i){const x=db.users[i];ask(`¿Eliminar al usuario «${esc(x.u)}» y todos sus gastos?`,()=>{db.users.splice(i,1);delete db.data[x.u];save();R()})}
async function cp(){const p=$('#np').value;if(p.length<4)return er('Mín. 4 caracteres');const x=db.users.find(z=>z.u==U);x.s=gen();x.h=await hp(p,x.s);save();$('#np').value='';er('Contraseña cambiada')}
/* ---- categorías ---- */
function addc(){const v=$('#ac').value.trim();if(!v||D.cats.includes(v))return er('Nombre vacío o repetido');D.cats.push(v);save();R()}
function rn(i){const o=D.cats[i];ask('Nuevo nombre de la categoría',v=>{if(!v||D.cats.includes(v))return er('Nombre inválido o repetido');D.exp.forEach(e=>{if(e.c==o)e.c=v});if(D.bud&&D.bud[o]){D.bud[v]=D.bud[o];delete D.bud[o]}D.cats[i]=v;save();R()},o)}
function bd(i){const c=D.cats[i];ask('Presupuesto mensual de «'+esc(c)+'» (solo número; 0 para quitarlo)',v=>{const n=parseFloat(v);if(isNaN(n)||n<0)return er('Monto inválido');D.bud=D.bud||{};if(n)D.bud[c]=n;else delete D.bud[c];save();R()},D.bud&&D.bud[c]||'')}
function dc(i){if(D.cats.length<2)return er('Debe quedar al menos una categoría');const c=D.cats[i];ask(`¿Eliminar «${esc(c)}»? Sus gastos pasarán a otra categoría.`,()=>{D.cats.splice(i,1);const t=D.cats.includes('Otros')?'Otros':D.cats[0];D.exp.forEach(e=>{if(e.c==c)e.c=t});if(D.bud)delete D.bud[c];save();R()})}
/* ---- gastos ---- */
const nw=(f,i)=>mod(null,f,i!=null?D.cats[i]:null),ed=id=>mod(D.exp.find(e=>e.id==id));
function sv(id,again){let c=mc;if(c=='__n'){c=$('#nc').value.trim();if(!c)return er('Escribe el nombre de la categoría')}
const o={f:$('#mf').value,n:$('#mn').value.trim(),c,m:parseFloat($('#mm').value),t:$('#mt').value.trim()};
if(!o.f||!o.n||isNaN(o.m)||o.m<0)return er('Completa fecha, concepto y monto');
if(!D.cats.includes(c))D.cats.push(c);
if(id)Object.assign(D.exp.find(e=>e.id==id),o);else D.exp.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),...o});
save();const[a,b]=rg();if(o.f<iso(a)||o.f>iso(b)){anc=pd(o.f);if(mode=='rng')rf=rt=o.f}
cl();R();if(again){mod(null,o.f);er('Guardado')}}
function dl(id){ask('¿Eliminar este gasto?',()=>{D.exp=D.exp.filter(e=>e.id!=id);save();R()})}
/* ---- respaldo ---- */
function bkc(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';$('#bk').value='fecha,concepto,categoria,monto,nota\n'+[...D.exp].sort((x,y)=>x.f<y.f?-1:1).map(e=>[e.f,q(e.n),q(e.c),e.m,q(e.t)].join(',')).join('\n')}
function rst(){let j;try{j=JSON.parse($('#bk').value)}catch(e){return er('Respaldo inválido')}
if(!j||!Array.isArray(j.cats)||!Array.isArray(j.exp))return er('Respaldo inválido');
ask('Esto reemplazará tus gastos y categorías actuales. ¿Continuar?',()=>{D.cats=j.cats.map(String);D.bud=j.bud||{};D.gb=j.gb||{};D.exp.length=0;j.exp.forEach(e=>{if(e&&e.f&&!isNaN(+e.m)){if(!D.cats.includes(e.c))D.cats.push(String(e.c));D.exp.push({id:String(e.id||Math.random().toString(36).slice(2)),f:String(e.f),n:String(e.n||''),c:String(e.c),m:+e.m,t:String(e.t||'')})}});save();R()})}
(async()=>{const c=LS.get('cg_lic','');if(c)LIC=await lic(c);U=null;LS.set('cg_ses',null);R()})();
function lock(){if(U){U=null;D=null;LS.set('cg_ses',null);cl();R()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)lock()});addEventListener('pagehide',lock);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
